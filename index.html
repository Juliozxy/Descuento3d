<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limpieza Firestore</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <header>
    <h1>Limpieza de mensajes</h1>
    <p>Herramienta administrativa para eliminar mensajes por fecha.</p>
  </header>

  <section id="loginPanel">
    <label>Correo del administrador</label>
    <input id="email" type="email" autocomplete="username" placeholder="admin@ejemplo.com">
    <label>Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
    <button id="loginButton">Ingresar</button>
    <p id="loginError" class="error"></p>
  </section>

  <section id="adminPanel" class="hidden">
    <div class="userbar"><span id="userStatus"></span><button id="logoutButton" class="secondary">Salir</button></div>

    <label>Clave de conversación</label>
    <input id="roomKey" type="text" autocomplete="off" placeholder="Escribe la misma clave de la conversación">

    <label>Eliminar mensajes desde</label>
    <input id="fromDate" type="date">

    <button id="findButton">Buscar mensajes</button>

    <div id="result" class="result hidden">
      <strong id="count">0</strong> mensajes encontrados.
      <div id="rangeText"></div>
    </div>

    <div id="deleteArea" class="hidden">
      <p class="warning">⚠️ Esta operación es permanente. Los mensajes eliminados no se pueden recuperar.</p>
      <button id="deleteButton" class="danger">Eliminar mensajes encontrados</button>
    </div>

    <p id="status"></p>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
