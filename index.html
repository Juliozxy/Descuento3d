<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buzón privado</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<section id="loginPanel" class="card">
<h1>Buzón privado</h1>
<p class="muted">Ingresa la clave de la conversación.</p>
<input id="roomKey" type="password" autocomplete="off" placeholder="Clave de acceso" maxlength="128">
<button id="enterRoom">Entrar</button>
<p id="loginError" class="error"></p>
<p id="status" class="status">Conectando…</p>
</section>
<section id="chatPanel" class="card hidden">
<header class="chatHeader">
<div><h1>Buzón privado</h1><p id="statusChat" class="status">Conversación privada</p></div>
<button id="copyLink" class="secondary">Copiar enlace</button>
</header>
<div id="messages" class="messages"></div>
<form id="messageForm" class="composer">
<textarea id="messageInput" maxlength="2000" placeholder="Escribe un mensaje…" required></textarea>
<div class="composerBottom"><span id="counter">0/2000</span><button id="sendButton">Enviar</button></div>
</form>
</section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
